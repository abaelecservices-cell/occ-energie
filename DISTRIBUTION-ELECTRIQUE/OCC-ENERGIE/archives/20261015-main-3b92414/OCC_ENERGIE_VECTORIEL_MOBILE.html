<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a9f5a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OCC Énergie">
<title>OCC ÉNERGIE</title>
<meta name="description" content="OCC ÉNERGIE — Cartographie du réseau électrique. Designed by Labidi El Fahli.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%230a9f5a'/%3E%3Cpath d='M35 10 18 36h12l-3 18 19-28H34z' fill='white'/%3E%3C/svg%3E">
<style>:root{
  --occ:#0a9f5a; --occ-2:#2fcf7f; --occ-deep:#06703f; --occ-soft:rgba(10,159,90,.12);
  --bg:#eef3f0; --bg-2:#e3ece7; --ink:#0f1a14; --ink-2:#44534b; --ink-3:#7a8a81;
  --glass:rgba(255,255,255,.58); --glass-strong:rgba(255,255,255,.78); --glass-brd:rgba(255,255,255,.75);
  --line:rgba(15,26,20,.10); --shadow:0 10px 40px rgba(16,40,28,.14); --shadow-s:0 2px 10px rgba(16,40,28,.10);
  --on:#12b76a; --off:#e5484d; --warn:#f5a524; --info:#3b82f6; --unk:#9aa5a0;
  --r:22px; --r-s:14px; --blur:saturate(180%) blur(22px);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1310; --bg-2:#0f1a15; --ink:#e9f2ed; --ink-2:#b5c4bc; --ink-3:#7f9188;
  --glass:rgba(28,40,34,.55); --glass-strong:rgba(30,44,37,.82); --glass-brd:rgba(255,255,255,.10);
  --line:rgba(255,255,255,.09); --shadow:0 10px 40px rgba(0,0,0,.45); --shadow-s:0 2px 10px rgba(0,0,0,.35);
  --occ-soft:rgba(47,207,127,.14);
}}
:root[data-theme="dark"]{
  --bg:#0b1310; --bg-2:#0f1a15; --ink:#e9f2ed; --ink-2:#b5c4bc; --ink-3:#7f9188;
  --glass:rgba(28,40,34,.55); --glass-strong:rgba(30,44,37,.82); --glass-brd:rgba(255,255,255,.10);
  --line:rgba(255,255,255,.09); --shadow:0 10px 40px rgba(0,0,0,.45); --shadow-s:0 2px 10px rgba(0,0,0,.35);
  --occ-soft:rgba(47,207,127,.14);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:var(--font);color:var(--ink);background:var(--bg);font-size:15px;line-height:1.45;
  background-image:radial-gradient(1200px 600px at 10% -10%,rgba(47,207,127,.22),transparent 60%),
  radial-gradient(900px 500px at 110% 10%,rgba(10,159,90,.16),transparent 60%),
  radial-gradient(800px 600px at 50% 120%,rgba(59,130,246,.08),transparent 60%);background-attachment:fixed;
  overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--occ)}
.glass{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-brd);
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.55)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:var(--glass-strong)}}

/* ---------- barre haute ---------- */
#top{position:sticky;top:0;z-index:50;padding:calc(env(safe-area-inset-top) + 10px) 16px 14px;display:flex;gap:12px;align-items:center;
  background:linear-gradient(var(--bg) 55%,transparent)}
.brand{display:flex;align-items:center;gap:10px;padding:7px 14px 7px 7px;border-radius:999px;flex:none;text-decoration:none;color:var(--ink)}
.brand .logo{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:11px;letter-spacing:.3px;
  background:radial-gradient(circle at 30% 25%,var(--occ-2),var(--occ) 55%,var(--occ-deep));box-shadow:inset 0 1px 1px rgba(255,255,255,.6),0 4px 12px rgba(10,159,90,.45)}
.brand b{font-size:15px;letter-spacing:.2px}.brand small{display:block;font-size:10.5px;color:var(--ink-3);margin-top:-2px}
#searchwrap{position:relative;flex:1;max-width:760px;margin:0 auto}
#search{width:100%;height:46px;border-radius:999px;padding:0 46px 0 46px;font:inherit;font-size:16px;color:var(--ink);outline:none}
#search::placeholder{color:var(--ink-3)}
#search:focus{box-shadow:var(--shadow),0 0 0 4px var(--occ-soft)}
#searchwrap .ico{position:absolute;left:16px;top:13px;width:20px;height:20px;color:var(--ink-3)}
#clear{position:absolute;right:8px;top:7px;width:32px;height:32px;border-radius:50%;border:0;background:var(--line);display:none}
#results{position:absolute;left:0;right:0;top:54px;border-radius:var(--r);max-height:min(70vh,640px);overflow:auto;display:none;padding:8px;
  background:var(--glass-strong)}
#results.open{display:block}
.res{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:14px;cursor:pointer}
.res:hover,.res.sel{background:var(--occ-soft)}
.res .t{font-weight:600}.res .p{font-size:12.5px;color:var(--ink-2)}
.res mark{background:rgba(47,207,127,.35);color:inherit;border-radius:3px;padding:0 1px}
.topact{display:flex;gap:8px;flex:none}
.iconbtn{width:42px;height:42px;border-radius:50%;border:0;display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px}

/* ---------- pastilles ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;
  background:rgba(127,140,133,.14);color:var(--ink-2);border:1px solid transparent;line-height:1.5}
.pill.g{background:rgba(18,183,106,.14);color:#0a8a50}.pill.r{background:rgba(229,72,77,.13);color:#c4282e}
.pill.a{background:rgba(245,165,36,.16);color:#a76700}.pill.b{background:rgba(59,130,246,.13);color:#2563eb}
.pill.k{background:var(--ink);color:var(--bg)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill.g{color:#4ade80}:root:not([data-theme="light"]) .pill.r{color:#ff8b8f}:root:not([data-theme="light"]) .pill.a{color:#fbbf24}:root:not([data-theme="light"]) .pill.b{color:#93c5fd}}
:root[data-theme="dark"] .pill.g{color:#4ade80}:root[data-theme="dark"] .pill.r{color:#ff8b8f}:root[data-theme="dark"] .pill.a{color:#fbbf24}:root[data-theme="dark"] .pill.b{color:#93c5fd}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none;margin-top:6px}
.dot.on{background:var(--on);box-shadow:0 0 0 3px rgba(18,183,106,.18)}.dot.off{background:var(--off);box-shadow:0 0 0 3px rgba(229,72,77,.18)}
.dot.unk{background:var(--unk)}
.chip{border:1px solid var(--line);background:var(--glass);border-radius:999px;padding:8px 14px;font-weight:600;font-size:13.5px;
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.chip:hover{border-color:var(--occ);color:var(--occ)}
.chip.on{background:var(--occ);color:#fff;border-color:var(--occ);box-shadow:0 6px 18px rgba(10,159,90,.35)}
.seg{display:inline-flex;padding:4px;border-radius:999px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:8px 14px;border-radius:999px;font-weight:600;font-size:13px;color:var(--ink-2)}
.seg button.on{background:var(--glass-strong);color:var(--ink);box-shadow:var(--shadow-s)}

/* ---------- mise en page ---------- */
main{padding:6px 16px 130px;max-width:1280px;margin:0 auto}
h1{font-size:30px;letter-spacing:-.6px;margin:14px 0 4px}h2{font-size:21px;letter-spacing:-.3px;margin:26px 0 10px}
h3{font-size:16px;margin:16px 0 8px}
.sub{color:var(--ink-2);margin:0 0 14px}
.card{border-radius:var(--r);padding:18px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--ink-3)}.small{font-size:12.5px}.mono{font-family:var(--mono);font-size:12.5px}
.kpi{border-radius:var(--r);padding:16px 18px}.kpi b{font-size:28px;letter-spacing:-.5px;display:block}.kpi span{color:var(--ink-2);font-size:13px}
.bcard{border-radius:var(--r);padding:16px;cursor:pointer;transition:transform .18s ease,box-shadow .18s ease;display:flex;flex-direction:column;gap:8px}
.bcard:hover{transform:translateY(-2px)}
.bcard .sw{width:100%;height:8px;border-radius:999px}
.list{display:flex;flex-direction:column;gap:2px}
.li{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:12px;cursor:pointer}
.li:hover{background:var(--occ-soft)}
.li .grow{flex:1;min-width:0}
.banner{border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:13.5px}
.banner.sim{background:rgba(245,165,36,.16);border:1px solid rgba(245,165,36,.45)}
.banner.danger{background:rgba(229,72,77,.12);border:1px solid rgba(229,72,77,.4)}
.banner.info{background:var(--occ-soft);border:1px solid rgba(10,159,90,.3)}
.btn{border:0;border-radius:999px;padding:10px 16px;font-weight:600;font-size:14px;background:var(--occ);color:#fff;
  box-shadow:0 6px 18px rgba(10,159,90,.3);display:inline-flex;gap:8px;align-items:center}
.btn.ghost{background:var(--glass-strong);color:var(--ink);box-shadow:var(--shadow-s);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.tablewrap{overflow:auto;border-radius:var(--r-s)}
input.f,select.f,textarea.f{width:100%;font:inherit;color:var(--ink);background:var(--glass-strong);border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:none}
input.f:focus,select.f:focus,textarea.f:focus{border-color:var(--occ);box-shadow:0 0 0 3px var(--occ-soft)}

/* ---------- barre d'onglets ---------- */
#tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:60;display:flex;gap:4px;padding:6px;border-radius:999px;max-width:calc(100vw - 20px);overflow-x:auto;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
#tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:68px;padding:7px 10px;border-radius:999px;text-decoration:none;color:var(--ink-2);font-size:11px;font-weight:600}
#tabs a svg{width:21px;height:21px}
#tabs a.on{background:var(--occ);color:#fff;box-shadow:0 6px 16px rgba(10,159,90,.4)}
footer{text-align:center;color:var(--ink-3);font-size:12px;padding:10px 0 0}
footer b{color:var(--ink-2);font-weight:600}

/* ---------- fiche (panneau) ---------- */
#scrim{position:fixed;inset:0;background:rgba(10,20,15,.25);z-index:70;opacity:0;pointer-events:none;transition:opacity .25s}
#scrim.open{opacity:1;pointer-events:auto}
#sheet{position:fixed;z-index:80;top:12px;right:12px;bottom:12px;width:min(520px,calc(100vw - 24px));border-radius:26px;
  transform:translateX(110%);transition:transform .32s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;background:var(--glass-strong)}
#sheet.open{transform:none}
#sheet .hd{padding:16px 18px 10px;display:flex;gap:10px;align-items:flex-start;border-bottom:1px solid var(--line)}
#sheet .hd h2{margin:4px 0 0;font-size:19px}
#sheet .bd{padding:6px 18px 30px;overflow:auto;flex:1}
#sheet .grab{display:none}
@media (max-width:760px){
  #sheet{top:auto;left:0;right:0;bottom:0;width:100%;height:88vh;border-radius:26px 26px 0 0;transform:translateY(105%)}
  #sheet .grab{display:block;width:40px;height:5px;border-radius:9px;background:var(--line);margin:8px auto 0}
  h1{font-size:25px}
  .brand small,.brand b{display:none}.brand{padding:5px}
  #tabs{gap:0;padding:5px}
  #tabs a{min-width:0;padding:6px 7px;font-size:9.5px}
  #tabs a svg{width:19px;height:19px}
  .viewer{height:62vh}
  main{padding:4px 16px 120px}
}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:13.5px;margin:8px 0}
.kv dt{color:var(--ink-3)}.kv dd{margin:0}
.crumbs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:13px;margin:6px 0}
.crumbs a{cursor:pointer;text-decoration:none;padding:3px 9px;border-radius:999px;background:var(--line);color:var(--ink)}
.crumbs a:hover{background:var(--occ-soft);color:var(--occ)}
.crumbs i{color:var(--ink-3);font-style:normal}
.blk{border-radius:18px;padding:14px;margin:12px 0;background:rgba(127,140,133,.08);border:1px solid var(--line)}
.blk h4{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-2)}
.path{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12.5px;margin:6px 0;padding:8px;border-radius:12px;background:var(--glass)}
.path span.n{padding:2px 8px;border-radius:999px;background:var(--line);cursor:pointer}
.path span.n.on{background:rgba(18,183,106,.18)}.path span.n.off{background:rgba(229,72,77,.16)}
.path i{color:var(--ink-3);font-style:normal}
.src{font-size:11.5px;color:var(--ink-3)}

/* ---------- visionneuse SVG ---------- */
.viewer{position:relative;border-radius:var(--r);overflow:hidden;height:min(72vh,760px);touch-action:none;background:
  linear-gradient(var(--glass),var(--glass)),repeating-linear-gradient(0deg,transparent 0 39px,var(--line) 39px 40px),repeating-linear-gradient(90deg,transparent 0 39px,var(--line) 39px 40px)}
.viewer svg{width:100%;height:100%;display:block;cursor:grab;user-select:none;-webkit-user-select:none}
.viewer svg:active{cursor:grabbing}
.vtools{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.vtools button{width:40px;height:40px;border-radius:50%;border:0;font-size:20px;font-weight:600}
.legend{position:absolute;left:12px;bottom:12px;padding:8px 12px;border-radius:14px;font-size:12px;display:flex;gap:12px;flex-wrap:wrap}
.hit{cursor:pointer}.hit:hover .hl{stroke:#3b82f6;stroke-width:3;opacity:.9}
.hl{fill:none;stroke:transparent}
.flash .hl{stroke:#3b82f6;stroke-width:5;animation:flash 1.1s ease-in-out infinite}
/* carte du site : bâtiments invisibles, contour + légende au survol seulement */
.zone{cursor:pointer}.zone .zout{stroke:transparent;transition:stroke .12s}.zone:hover .zout,.zone.flash .zout{stroke:#fff}
.zone .zlab{opacity:0;transition:opacity .12s}.zone:hover .zlab,.zone.flash .zlab{opacity:1}
/* arborescence du réseau */
.tree{padding:12px 14px}
.tnode{margin:2px 0}.tnode>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:7px 8px;border-radius:12px}
.tnode>summary::-webkit-details-marker{display:none}
.tnode>summary::before{content:'▸';font-size:12px;color:var(--ink-3);width:12px;transition:transform .15s}.tnode[open]>summary::before{transform:rotate(90deg)}
.tnode>summary:hover,.tleaf:hover{background:var(--occ-soft)}
.tleaf{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 8px 6px 28px;border-radius:12px}
.tkids{margin-left:14px;padding-left:12px;border-left:2px solid var(--line)}
.ticon{width:20px;text-align:center;font-weight:800;color:var(--occ)}
.tname{font-weight:700;color:var(--ink);text-decoration:none}.tname:hover{text-decoration:underline}
.tmeta{font-size:12.5px;color:var(--ink-3)}.tmeta a{color:var(--ink-2)}
.tact{margin-left:auto;text-decoration:none;font-size:15px;padding:2px 8px;border-radius:999px;background:var(--occ-soft)}
.tact+.tact{margin-left:4px}
.tsep{color:var(--ink-3);margin:0 2px}
.tcpl{font-size:12.5px;color:var(--ink-3);padding:2px 8px 2px 34px}
.thalf>summary{font-size:14px}
.troot>summary{font-size:16px}
/* mini-schéma TGBT (avant / après) */
.synrow{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin:12px 0}
.synmini{margin:0;flex:1 1 260px;max-width:340px;padding:10px;border-radius:16px;background:var(--glass-strong);border:1px solid var(--line)}
.synmini svg{width:100%;height:auto;display:block}.synmini figcaption{font-size:12.5px;text-align:center;margin-top:4px;line-height:1.35}
.synarrow{font-size:26px;color:var(--occ);font-weight:800}
@keyframes flash{50%{stroke:#ffd23f;opacity:.55}}
.empty{padding:40px;text-align:center;color:var(--ink-3)}
.flow{stroke-dasharray:22 16;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-38}}
@media (prefers-reduced-motion:reduce){.flow{animation:none}}
.hero{border-radius:28px;padding:16px;margin-top:8px}
.herotxt{display:flex;gap:14px;align-items:center;margin:4px 4px 12px}
.logo.big{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;flex:none;
  background:radial-gradient(circle at 30% 25%,var(--occ-2),var(--occ) 55%,var(--occ-deep));box-shadow:inset 0 1px 1px rgba(255,255,255,.6),0 6px 18px rgba(10,159,90,.45)}
.hero .viewer{height:min(64vh,640px);background:#1d2a23}
/* carte du site : la photo seule, sans fond ni cadre, à ses propres proportions */
.sitemap{margin-top:8px}
.sitemap .viewer,.sitemap .viewer.glass{height:auto;aspect-ratio:var(--ar,1.32);max-height:78vh;background:transparent!important;border:0!important;box-shadow:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;border-radius:14px}
.tag{font-family:var(--mono)}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);padding:10px 16px;border-radius:999px;z-index:90;font-weight:600;font-size:13.5px}
/* fiches de dépendance */
.fhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin:14px 0 10px;padding-bottom:10px;border-bottom:2px solid var(--occ)}
.fstage{display:flex;gap:12px;align-items:flex-start}
.fnum{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;background:var(--occ)}
.farrow{text-align:left;padding-left:8px;color:var(--occ);font-size:12px;line-height:1;margin:4px 0}
.fsteps{padding-left:20px;margin:0}.fsteps li{margin:0 0 12px}
.fiche h2{margin-top:22px}
/* ⚡ remettre le courant : gros boutons, choix, fiche de manœuvre lisible sur tablette */
.bigbtn{display:flex;align-items:center;gap:14px;padding:16px 20px;border-radius:22px;color:#fff;text-decoration:none;cursor:pointer;font-size:30px;
  background:radial-gradient(circle at 20% 10%,var(--occ-2),var(--occ) 55%,var(--occ-deep));box-shadow:0 10px 28px rgba(10,159,90,.35),inset 0 1px 1px rgba(255,255,255,.5)}
.bigbtn b{display:block;font-size:20px}.bigbtn span{display:block;font-size:13px;opacity:.9;font-weight:500}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{border:0;border-radius:18px;padding:14px;text-align:left;cursor:pointer;color:var(--ink);font:inherit;display:flex;flex-direction:column;gap:2px;min-height:64px}
.tile b{font-size:16px}.tile span{font-size:12px;color:var(--ink-3)}.tile:hover{transform:translateY(-1px)}
input.f.big{font-size:17px;padding:14px 16px;border-radius:16px}
.choices{display:grid;gap:10px}
.choice{border:2px solid var(--line);border-radius:18px;padding:16px 18px;text-align:left;cursor:pointer;color:var(--ink);font:inherit;display:flex;flex-direction:column;gap:3px}
.choice b{font-size:18px}.choice span{font-size:13.5px;color:var(--ink-3)}.choice:hover{border-color:var(--occ)}
.choice.minor{padding:10px 16px;border-style:dashed}.choice.minor b{font-size:14.5px}
.moloc{font-size:14px;margin-top:2px}
.mosheet{margin-top:8px}.mohead h1{margin:2px 0 4px;font-size:26px;line-height:1.2}
.mostop{display:flex;gap:10px;align-items:flex-start;margin:14px 0;padding:14px 16px;border-radius:16px;background:rgba(229,72,77,.14);border:2px solid #e5484d;font-size:15px;line-height:1.4}
.moavant{margin:0 0 14px;padding:10px 16px;border-radius:16px;background:var(--occ-soft);font-size:14px}.moavant ul{margin:6px 0 0;padding-left:18px}.moavant li{margin:3px 0}
.mosteps{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.mosteps label{display:flex;gap:12px;align-items:center;cursor:pointer;padding:12px 14px;border-radius:16px;background:var(--glass-strong);border:1px solid var(--line);font-size:16px;line-height:1.45}
.mosteps .num{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:16px;color:#fff;background:var(--occ)}
.mosteps input{width:22px;height:22px;flex:none;accent-color:var(--occ);order:3;margin-left:auto}
.mosteps input:checked~.txt{opacity:.45;text-decoration:line-through}.mosteps input:checked~.num{background:var(--ink-3)}
.mosteps .pill{font-size:12px}
.mofoot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px;color:var(--ink-3)}
/* statut de la fiche, affiché AVANT les étapes */
.mostatus{display:flex;gap:10px;align-items:flex-start;margin:12px 0 0;padding:12px 16px;border-radius:16px;font-size:14px;line-height:1.4}
.mostatus .small{color:var(--ink-3);margin-top:3px}
.mostatus.proj{background:rgba(245,165,36,.16);border:2px solid var(--warn)}
.mostatus.old{background:rgba(245,165,36,.22);border:2px dashed var(--warn)}
.mostatus.ctrl{background:rgba(59,130,246,.10);border:2px solid rgba(59,130,246,.5)}
.mostatus.ok{background:var(--occ-soft);border:2px solid var(--occ)}
.btn.mini{padding:5px 12px;font-size:13px;display:inline-block;text-decoration:none}
.simnote{margin:12px 0 4px;align-items:center;flex-wrap:wrap}
.moinsul{margin-top:12px;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.moinsul table{width:100%;border-collapse:collapse;margin-top:6px}.moinsul td,.moinsul th{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left}
.moinsul .src{grid-column:1/-1;margin:0}
.quick .btn{font-size:13.5px;padding:8px 14px}
.mosign{display:none;margin-top:14px;border-top:1px solid var(--line);padding-top:8px}.mosign div{margin:10px 0}
@media print{#top,#tabs,#sheet,#scrim{display:none}body{background:#fff}
  .noprint,footer{display:none!important}.glass{background:#fff!important;box-shadow:none!important;backdrop-filter:none!important;border:1px solid #ccc}
  .fiche h2{break-after:avoid}.fstage,.fsteps li,.mosteps li{break-inside:avoid}.fiche a{color:inherit;text-decoration:none}
  .mosign{display:block}.mosteps input:checked~.txt{opacity:1;text-decoration:none}
  .mosteps label{background:#fff;border:1px solid #bbb;font-size:13px;padding:7px 10px}.mosteps .num{background:#0a9f5a!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .mostop,.mostatus{-webkit-print-color-adjust:exact;print-color-adjust:exact}.crumbs{display:none}}


/* Parcours guidé : le tracé visible suit uniquement les segments du modèle dessinés.
   Orange pointillé = preuve documentaire insuffisante. Aucun câble n'est inventé. */
.trace-summary{margin:12px 0;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--glass-strong)}
.trace-steps{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:10px}
.trace-step{border:1px solid #13a565;background:rgba(18,183,106,.10);color:var(--ink);padding:6px 9px;border-radius:9px;cursor:pointer;font:inherit;font-size:12px;font-weight:700}
.trace-step.trace-doubt{border-color:#df9230;background:rgba(240,162,32,.10);border-style:dashed}
.trace-arrow{font-weight:800;color:var(--ink-3)}
#hta svg .trace-wire{stroke:#ffe04b!important;stroke-width:7!important;filter:drop-shadow(0 0 4px rgba(255,210,63,.75))}
#hta svg .trace-wire.trace-doubt{stroke:#f59e0b!important;stroke-dasharray:8 5!important}
#hta svg .trace-node .hl{stroke:#ffe04b;stroke-width:5;opacity:1;filter:drop-shadow(0 0 6px rgba(255,210,63,.65))}
#hta svg .trace-node.trace-doubt .hl{stroke:#f59e0b;stroke-dasharray:8 5}
#site-map .viewer{height: min(75vh,780px)}
#site-map svg .zone.flash .zout{stroke:#ffe04b;stroke-width:5;filter:drop-shadow(0 0 3px #ffd23f)}
#site-map svg .zone.flash .zlab{opacity:1}
</style>

 documentaire non utilisable pour la consignation. Les prises amont du disjoncteur principal peuvent rester sous tension."}},"issues":[{"id":"I-TR12","sev":"moyenne","title":"Repères « VERS TGBT » inversés sur l’unifilaire (TR 1A / TR 2A)","text":"L’unifilaire 20 kV (R112529 rév. H) porte sous la cellule « TR 1A » la mention « VERS TGBT 2 » et sous « TR 2A » « VERS TGBT 1 ». Règle donnée par l’exploitant : chaque TGBT n est alimenté par les transformateurs TR nA et TR nB (cohérent avec l’Excel et le plan Schneider TGBT 2 « ARRIVÉE TRANSFO TR2A »). Le modèle applique TR 1A → TGBT 1A et TR 2A → TGBT 2A. Reste à vérifier que les cellules HTA repérées « TR 1A » / « TR 2A » sur le tableau 20 kV alimentent bien ces transformateurs (étiquettes de cellule). Lecture détaillée : le disjoncteur BT dessiné sous TR 1A est un NW32H1 Micrologic 5.0P (clé T1b EL42462) — c’est le modèle de l’arrivée du TGBT 1A (plan Schneider TGBT1A, case 2-28), alors que l’arrivée TR2A du TGBT 2 est un NW40H1. Avec l’étiquette « PROVIENT DE TR 1A » photographiée sur le TGBT 1, trois éléments indiquent TR 1A → TGBT 1 : les mentions « VERS TGBT 2 / VERS TGBT 1 » de l’unifilaire sont très probablement inversées. — Photos du tableau 20 kV (Sous-station 2) : les plaques gravées donnent, côté A, « TRANSFORMATEUR 2A » puis « TRANSFORMATEUR 1A » contre l’arrivée secours EDF, symétriquement au côté B (arrivée CNR, 1B, 2B…). L’unifilaire place TR 1A puis TR 2A : nouvel indice que l’unifilaire inverse 1A et 2A. À confirmer par le suivi des câbles.","refs":["schema unifilaire 20 KV derniere version.pdf","Copie de Distribution.xlsm","p1.zip › 11_TGBT N°2 › plan mise a jour TGBT N°2 (Bronzini).pdf","Tableau 20kv edf cnr .pdf p6, p9"],"ents":["TR1A","TR2A","TGBT1","TGBT2"],"status":"actif"},{"id":"I-TGBT3-XL","sev":"moyenne","title":"TGBT 3 absent du classeur Excel","text":"Le classeur ne contient aucun onglet « TR 3A & 3B ». Les départs du TGBT 3 proviennent uniquement du dossier Schneider CX7810 (liste des consommateurs).","refs":["Copie de Distribution.xlsm","p1 - Copie.zip › 12_TGBT N°3 › CX7810_C TQC.PDF"],"ents":["TGBT3"],"status":"actif"},{"id":"I-TR-KVA","sev":"basse","title":"TR 3A / 3B : 2000 kVA confirmé par les plaques ; type de surveillance à vérifier","text":"Les documents France Transfo du dossier TGBT 3 (n° 1466597 et 1466588, essais de janvier 2025) donnent 2000 kVA, Trihal sec enrobé, surveillance par sondes de température. L’unifilaire indique « DGPT2 » (protection des transformateurs immergés) pour TR 3B : si TR 3B est l’un de ces Trihal, la protection est par sondes, pas par DGPT2. Les plans Schneider TGBT 2 et 3 indiquent toujours « 2000 kVA (2500 kVA) » avec des arrivées 3520 A (réserve de puissance). Plaques de TR 2A / 2B non fournies.","refs":["schema unifilaire 20 KV derniere version.pdf","p1.zip › 11_TGBT N°2 › plan mise a jour TGBT N°2 (Bronzini).pdf","p1 - Copie.zip › 12_TGBT N°3 › CX7810_C TQC.PDF","p1 - Copie.zip › 12_TGBT N°3 › TRANSFORMATEUR › TR2 / TR3 (France Transfo : plan d’ensemble, procès-verbaux d’essais n° 1466597 et 1466588 du 28-29/01/2025, schémas de câblage)"],"ents":["TR2A","TR2B","TR3A","TR3B"],"status":"actif"},{"id":"I-LOC","sev":"basse","title":"Implantation physique des TGBT (résolue par le plan)","text":"Localisations reprises du plan d’implantation : TGBT 1 à 6, TS 2, tableau 20 kV arrivée CNR/EDF, condensateurs et onduleurs en Sous-station 2 ; TGBT 9, « Tr7 b » (TGBT 7), tableau 20 kV, gradathyr, varivolt, boosting en Sous-station 1 côté gauche ; tableau 6 kV, Gorge et Spang côté droit ; TS 9 / TS 17 en chaufferie ; TS 16 à la STEP.","refs":[],"ents":["TGBT1","TGBT2","TGBT3","TGBT4","TGBT5","TGBT6","TGBT7","TGBT8","TGBT9"],"status":"resolu"},{"id":"I-7H214","sev":"moyenne","title":"FRIGO 7H214 : TGBT 1A ou TGBT 3B ?","text":"Excel « TR 1A & 1B » H6 : « Frigo 7H214 » sur TGBT 1A. Plan Schneider TGBT 3 : « FRIGO 7H214 » case 6+28 (TGBT 3B). Probable transfert lors de la création du TGBT 3 — à vérifier.","refs":["Copie de Distribution.xlsm","p1 - Copie.zip › 12_TGBT N°3 › CX7810_C TQC.PDF"],"ents":["D0031"],"status":"actif"},{"id":"I-TS12","sev":"basse","title":"Alimentation du TS12","text":"Trois sources documentaires : Excel L7 (TGBT 2B, « TS12 Emballage, situé aux travaux neufs ») ; plan TGBT 2 case 6-36 « TS12 ROVING » ; plan TGBT 3 cases 2+18 « TS12A » et 5+18 « TS12B ». Le modèle relie le TS12 aux départs du TGBT 3 ; le départ TGBT 2 6-36 est conservé sans liaison active. Photos TGBT 2 : la case 6-36 porte aujourd’hui « RÉSERVE » (ancienne étiquette retirée, départ condamné) : le TS 12 n’est plus alimenté par le TGBT 2. Alimentation actuelle : TGBT 3 (TS12A case 2+18, TS12B case 5+18).","refs":["Copie de Distribution.xlsm","p1.zip › 11_TGBT N°2 › plan mise a jour TGBT N°2 (Bronzini).pdf","p1 - Copie.zip › 12_TGBT N°3 › CX7810_C TQC.PDF"],"ents":["TS12","D0010"],"status":"actif"},{"id":"I-TS43","sev":"basse","title":"TS42 / TS43 (filières 4A12-4A19)","text":"Étiquette TGBT 4 case 5-28 : « TS43 FILIÈRE 4A12 à 4A19 » ; Excel « TR 4A & 4B » L12 : « TS 42 Filières C4 4A12 à 4A19 ».","refs":["Copie de Distribution.xlsm","Tgbt 4.pdf p9"],"ents":["D0045"],"status":"actif"},{"id":"I-AGIT","sev":"basse","title":"Coffret agitateur sans parent","text":"Bloc « Coffret agitateur » (C50-C54, onglet TR 1A & 1B) : aucun départ amont identifié.","refs":["Copie de Distribution.xlsm"],"ents":["COFAGIT"],"status":"actif"},{"id":"I-TS24B","sev":"basse","title":"Bloc TS 24B dupliqué","text":"Le bloc « TS 24 B (Four 2) » apparaît à l’identique dans les onglets TR 4A & 4B (O9) et TR 6A & 6B (O7). Rattaché au TGBT 4B (L9) ; la copie de l’onglet TR 6 est ignorée.","refs":["Copie de Distribution.xlsm"],"ents":["TS24"],"status":"actif"},{"id":"I-TS17","sev":"haute","title":"Origine du TS 17 / TS 9 : TGBT 9 ou TR 2B ?","text":"Onglet « TR 9A & 9B » : TS 17A et TS 17B sur TGBT 9A / 9B. Mais la liste TS 17A contient « Arrivée 2A Normale » (C16) et les étiquettes arc du TS 9 indiquent « TABLEAU TR2B TS17B TS9 ». Hypothèse : étiquettes antérieures au « nouveau TGBT 9 ». À vérifier sur site. Nouvel élément : plaque « TS17A — EAU DE REFROIDISSEMENT — CASE A2-18 » sur le TGBT 9 (Tgbt 9.pdf p19), cohérente avec le classeur (TS 17A sur TGBT 9A).","refs":["Copie de Distribution.xlsm","Ts9.pdf p5, p7"],"ents":["TS17","TS9"],"status":"actif"},{"id":"I-TS9ARC","sev":"basse","title":"Étiquette arc TS 9 col. 3","text":"Relevé photo (Ts9.pdf p5) : 400 V ; Icc 1,62 kA ; 0,19 cal/cm² ; limite d’approche 14,91 cm. La maquette antérieure mentionnait 1,92 kA et 0,15 cal/cm² : relire la plaque.","refs":["Ts9.pdf p5"],"ents":["TS9"],"status":"actif"},{"id":"I-SS2PH","sev":"basse","title":"Photos des tableaux 20 kV (tri effectué)","text":"Tri fait sur les photos : « Tableau 20kv edf cnr » et « Départ 20kv edf cnr » = tableau 20 kV TR 1 à 6 (Sous-station 2) ; « Tableau 20kv SS1 » (3 séries) = tableau 20 kV TR 7 / 9 / boosting, sauf « Tableau 20kv     SS1 » p1-p11 = TGBT 8 (boosting). Aucune photo du poste de livraison.","refs":[],"ents":["SS2_20"],"status":"actif"},{"id":"I-TGBT1B-TR2B","sev":"moyenne","title":"Plan TGBT 1B : « ARRIVÉE TR2B »","text":"Le plan Schneider TH11A-TGBT1B (face avant unifilaire et liste colonne 5) indique « ARRIVÉE TRANSFO TR2B » en case 5-28, alors que l’étiquette sur le tableau porte « PROVIENT DE TR 1B — ARRIVÉE TGBT 1B — CASE 5-28 ». Le modèle suit l’étiquette (règle TR nA / TR nB).","refs":["TH11A-TGBT1B.pdf","Tgbt 1.pdf p6"],"ents":["TGBT1"],"status":"actif"},{"id":"I-TS46","sev":"basse","title":"Origine des TS 46A / TS 46B retrouvée","text":"Photos TGBT 1 : « TS 46A — CASE 1-53 » (demi-JdB A) et « TS 46B — CASE 6-53 » (demi-JdB B). Le plan TGBT1A 2010 indiquait en 1-53 « départ gr. froid 7H211 » (repris dans le classeur en « Frigo 7H214 », aujourd’hui sur le TGBT 3).","refs":["Tgbt 1.pdf p1, p9"],"ents":["TS46A","TS46B","TGBT1"],"status":"actif"},{"id":"I-7K121","sev":"basse","title":"Compresseurs 7K121 / 7K122 sur TGBT 7","text":"Classeur « TR 7A & 7B » : compresseurs 7K121 (H6) et 7K122 (H9) sur le TGBT 7A. Photos : « AE 7K122 » en colonne A2 (demi-JdB A) mais « AE 7K121 » en colonne B1 (demi-JdB B), et l’étiquette arc de la colonne A2 mentionne « TABLEAU TR7B 7K122 ». Rattachement à vérifier.","refs":["Tr7b .pdf p3, p5, p9","Copie de Distribution.xlsm"],"ents":["TGBT7"],"status":"actif"},{"id":"I-GE1","sev":"moyenne","title":"Groupe électrogène n°1 : deux tableaux secourus","text":"Les photos montrent une « ARRIVÉE GROUPE ÉLECTROGÈNE N°1 » sur le TS 7 (Four 1) et une « ARRIVÉE SECOURS GROUPE 1 » sur le TS 9 (chaufferie). Le simulateur interdit de mettre le groupe en parallèle avec le réseau ; la logique réelle de permutation (automatique / manuelle) est à fournir.","refs":["Ts 7.pdf p8","Ts9.pdf p1"],"ents":["TS7","TS9"],"status":"actif"},{"id":"I-BP2","sev":"moyenne","title":"By-pass total de l’onduleur 2 : TGBT 5A ou TGBT 6 ?","text":"La plaque de l’armoire « Alimentation ondulée onduleur 2 » indique « PROVIENT DE TGBT 5A — BY-PASS TOTAL ONDULEUR 2 » (cohérent avec le classeur, TGBT 5A H7). Mais le TGBT 6 porte aussi une étiquette « ONDULEUR 2 - BY PASS — CASE 2A-12 ». Le modèle suit la plaque de l’armoire ondulée.","refs":["Alimentation onduleur 2.pdf p2","Tgbt 6.pdf p1","Copie de Distribution.xlsm"],"ents":["ALIMOND2","TGBT6"],"status":"actif"},{"id":"I-KEYDUP","sev":"moyenne","title":"Codes de clés identiques sur des appareils différents","text":"Code EL13131 dessiné à la fois sur la cellule TR 2A (clé 02A) et sur la cellule TR 3B (clé 03, boîte T6g « 03 = EL13131 »). Code EL53511 dessiné à la fois pour S3 (TR 3B, « S3 = EL53511 ») et pour X1 (cellule TR 9A). Deux clés de même code ouvrent les mêmes serrures : à vérifier sur les serrures réelles (risque pour la consignation).","refs":["schema unifilaire 20 KV derniere version.pdf"],"ents":["SS1_C2A","SS1_C3B","SS2_C9A"],"status":"actif"},{"id":"I-BOOSTTC","sev":"basse","title":"Boosting : réglages identiques avec des rapports de TC différents","text":"Les deux cellules BOOSTING 3200 kVA ont le même réglage I> 110 A SIT, mais le TC retenu est 100/5 A pour S3 (Sch. 3182584) et 50/5 A pour S12 (Sch. 3182750) : vérifier le paramétrage réel des relais S2036.","refs":["schema unifilaire 20 KV derniere version.pdf"],"ents":["SS2_CB1","SS2_CB2"],"status":"actif"},{"id":"I-UNIXX","sev":"moyenne","title":"Cellules non renseignées sur l’unifilaire","text":"Repères « xx / Sxxxx / ELxxxx » et réglages non renseignés pour : TR Hydrogène, AEF1-TRZ1, AEF1-TRZ2, AEF2-TR1, AEF2-TR2, TR 9B (tableau 20 kV TR 7/9) et les arrivées 6 kV AEF2-A1 / AEF2-A2. Les réglages réels sont à relever sur les relais.","refs":["schema unifilaire 20 KV derniere version.pdf"],"ents":["SS2_CHYD","SS2_CZ1","SS2_CZ2","SS2_CBT1","SS2_CBT2","SS2_C9B","KV6_A1","KV6_A2"],"status":"actif"},{"id":"I-SSNUM","sev":"haute","title":"Numérotation des sous-stations différente selon les documents","text":"Plan d’implantation (exploitant) : Sous-station 2 = TGBT 1 à 6 + tableau 20 kV CNR/EDF ; Sous-station 1 = TGBT 9, TGBT 7, boosting, 6 kV. Unifilaire : « S/STATION 1 - 20KV » = tableau des TR 1 à 6, « S/STATION 2 - 20KV » = tableau des TR 7/9/boosting/6 kV. Étiquettes TGBT 4 « SST 1 » et rapport Schneider TGBT 1 « Sous station N°1 » ; plan Schneider TGBT 3 « Sous-station 2 » ; classeur onglet TR 7 « Sous/station n°2 ». L’application utilise la numérotation du plan d’implantation et rappelle l’appellation de l’unifilaire dans chaque fiche. À harmoniser (risque d’erreur lors d’une consignation).","refs":["PLAN IMPLANTATION 2.pptx","schema unifilaire 20 KV derniere version.pdf","Copie de Distribution.xlsm","p1.zip › 10_TGBT N°1 › OnSite_TechRpt_WO-12101777.pdf","p1 - Copie.zip › 12_TGBT N°3 › CX7810_C TQC.PDF"],"ents":["SS1_20","SS2_20","TGBT1","TGBT3","TGBT4"],"status":"actif"},{"id":"I-PDLPH","sev":"moyenne","title":"Poste de livraison CNR / EDF : aucune photo","text":"Le fichier « Départ 20kv edf cnr.pdf », d’abord rattaché au poste de livraison, montre le tableau 20 kV TR 1 à 6 de la Sous-station 2. La façade du poste de livraison reste dessinée d’après l’unifilaire seul.","refs":["Départ 20kv edf cnr.pdf"],"ents":["PL20"],"status":"actif"},{"id":"I-KV6ORD","sev":"basse","title":"Tableau 6 kV : ordre des groupes Spang","text":"Photos : à droite de l’arrivée transfo boosting B, les plaques donnent L6, L5 puis L4 en bout de tableau ; l’unifilaire dessine L4 contre l’arrivée et L6 en bout. Plaques des groupes côté A illisibles (positions L1 à L3 estimées). Correspondance des arrivées A / B avec les cellules 20 kV « boosting » à vérifier sur place.","refs":["Tableau 6kv.pdf p1-p13","schema unifilaire 20 KV derniere version.pdf"],"ents":["KV6","KV6_D4","KV6_D6","KV6_A1","KV6_A2"],"status":"actif"},{"id":"I-TGBT3-LOCK","sev":"haute","title":"TGBT 3 : clés Ronis dessinées mais « aucun verrouillage » écrit","text":"Le même dossier Schneider (CX7810_C, 12/2024) dessine des clés Ronis de choix de source (p6) et précise en p5 qu’il n’y a aucun verrouillage entre les arrivées et le couplage, la permutation étant à la charge de l’exploitant. Une alarme « arrivées en parallèle » est câblée (p19-21). L’application applique la règle d’exploitation (jamais 3 appareils fermés) sans affirmer qu’un verrouillage physique existe. À trancher sur place (serrures présentes ? clés ?).","refs":["p1 - Copie.zip › 12_TGBT N°3 › CX7810_C TQC.PDF"],"ents":["TGBT3","TGBT3_QA","TGBT3_QB","TGBT3_QC"],"status":"actif"},{"id":"I-TR3-COOL","sev":"basse","title":"TR 3B : DGPT2 (unifilaire) ou sec Trihal (dossier 2025) ?","text":"L’unifilaire R112529 rév. H indique une protection DGPT2 (transformateur immergé) pour le TR 3B. Le dossier du TGBT 3 (12/2024) et le dossier constructeur 2025 décrivent des transformateurs secs Trihal avec sondes PT100 et relais NT935 (ventilateur 1 à 130 °C, alarme à 140 °C, déclenchement à 150 °C sur le schéma de câblage). Le transformateur a probablement été remplacé : la fiche suit le dossier récent. Ces seuils sont ceux du dessin, pas une relève sur le relais.","refs":["schema unifilaire 20 KV derniere version.pdf","p1 - Copie.zip › 12_TGBT N°3 › CX7810_C TQC.PDF"],"ents":["TR3A","TR3B"],"status":"actif"},{"id":"I-VARIVOLT-TC","sev":"basse","title":"Varivolt : TC câblé en 200/5 (schéma 2023) ou en 100/5 (unifilaire) ?","text":"Les schémas Schneider des cellules DM1-A départ Varivolt (S000119797, dessins 697408-000 zone 1 et 697409-000 zone 2, 27/03/2023) portent « câblé sur grand rapport » sur les TC 3 × ARM3/N2F 200-100/5 A : le grand rapport est 200/5. L’unifilaire R112529 retient 100/5 (valeur soulignée). Le relais et ses réglages I> ne figurent pas sur ces schémas. À relever sur le relais.","refs":["p1 - Copie (2).zip › schema DM1 départ varivolt zone 1.pdf","p1 - Copie (2).zip › schema DM1 départ varivolt zone 2.pdf","schema unifilaire 20 KV derniere version.pdf"],"ents":["SS2_CZ1","SS2_CZ2","AEF1-TRZ1","AEF1-TRZ2"],"status":"actif"},{"id":"I-TGBT9-IMD","sev":"basse","title":"TGBT 9 : contrôleur d’isolement à identifier","text":"Les contrôleurs photographiés (Tgbt 9.pdf p22) sont des Vigilohm XML3xx (16 voies), pas des IM400. Référence exacte et notice à associer avant d’utiliser les seuils. Les seuils du TGBT 1 (rapport Schneider 2024) ne s’appliquent pas au TGBT 9.","refs":["Tgbt 9.pdf p22"],"ents":["TGBT9"],"status":"actif"},{"id":"I-OND2-KVA","sev":"basse","title":"Onduleur 2 : 100 ou 120 kVA ?","text":"La plaque QF1 de l’armoire ondulée se lit « GALAXY PW 120 KVA » (premier chiffre peu net, photo p2). L’application indiquait 100 kVA. Relever la plaque de l’onduleur.","refs":["Alimentation onduleur 2.pdf p2"],"ents":["ALIMOND2","OND2"],"status":"actif"},{"id":"I-VARIVOLT-PLATE","sev":"basse","title":"Varivolt : 901 kVA monophasé (plaque) / 900 kVA (unifilaire)","text":"La plaque constructeur (série 26013-1) indique 901 kVA monophasé, secondaire variable 50-350 V. L’unifilaire porte 900 kVA / 350 V pour AEF1-TRZ1 et TRZ2. L’unité à laquelle appartient la plaque n’est pas établie (les repères 26013-3 / 26013-4 des armoires de commande ne suffisent pas) : valeurs de l’unifilaire conservées.","refs":["26013 nameplate.pdf","schema unifilaire 20 KV derniere version.pdf"],"ents":["VARIVOLT","AEF1-TRZ1","AEF1-TRZ2"],"status":"actif"},{"id":"I-TS8-AMONT","sev":"haute","title":"TS8 — dérivations en amont du disjoncteur principal","text":"Plaque observée sur la travée 4. Les prises et dérivations concernées ne sont pas identifiées ; l'ouverture du disjoncteur principal ne constitue pas une preuve de mise hors tension.","refs":["Relevé TS8 15/10/2026"],"ents":["TS8"]}],"procs":[{"id":"P-TR3A","title":"Exploitation des verrouillages par serrures — Cellule DJ-TR3A","board":"TGBT3","ents":["TGBT3_QA","SS1_C3A","TR3A"],"status":"Document constructeur (Schneider Electric) — validation de l’exploitant requise","src":"p1 - Copie.zip › 12_TGBT N°3 › Verrouillage DJ TR3A.pdf","but":["INTERDIRE la fermeture du sectionneur de terre de la cellule « DJ-TR3A » tant que le circuit de commande du groupe n’est pas mis hors service.","INTERDIRE l’accès au transformateur de puissance tant que le sectionneur de terre de la cellule disjoncteur n’est pas verrouillé dans la position FERMÉ.","INTERDIRE la manœuvre en charge du sectionneur de ligne.","INTERDIRE l’accès au disjoncteur et aux transformateurs de courant, sectionneur de ligne fermé.","PERMETTRE la manœuvre à vide du disjoncteur, sectionneur de ligne ouvert."],"steps":["Ouvrir et verrouiller ouvert le disjoncteur BT QTR3A (la clé A3A est libre).","Porter la clé A3A sur la serrure de condamnation du sectionneur de terre de la cellule « DJ-TR3A ».","Ouvrir et verrouiller « ouvert » le disjoncteur de la cellule « DJ-TR3A » (récupérer la clé D3A libre).","À l’aide de la clé D3A déverrouiller, ouvrir et verrouiller « ouvert » le sectionneur de ligne (la 1re clé D3A est prisonnière et la 2e clé D3A est libre).","Possibilité de faire les essais à vide du disjoncteur à l’aide de la 2e clé D3A.","À l’aide de la clé A3A déverrouiller et fermer le sectionneur de terre de la cellule « DJ-TR3A » (la clé A3A devient prisonnière).","Enlever le panneau de la cellule « DJ-TR3A » (le sectionneur de terre peut être rouvert, la clé A3A reste prisonnière).","Panneau de la cellule « DJ-TR3A » enlevé, prendre la clé T3A à l’intérieur.","À l’aide de la clé T3A, déverrouiller l’un des volets de condamnation des bornes du transformateur (ces volets ôtés, la clé T3A reste prisonnière)."],"warn":"ATTENTION : les parties figurées en rouge sur le plan doivent être considérées comme restant sous tension après l’exécution des manœuvres énumérées. DÉFENSE D’OUVRIR TANT QUE LES CONDUCTEURS DE CE COMPARTIMENT N’ONT PAS ÉTÉ MIS HORS TENSION."},{"id":"P-TR3B","title":"Exploitation des verrouillages par serrures — Cellule DJ-TR3B","board":"TGBT3","ents":["TGBT3_QB","SS1_C3B","TR3B"],"status":"Document constructeur (Schneider Electric, scan transcrit le 12/10/2026) — validation de l’exploitant requise","src":"p1 - Copie.zip › 12_TGBT N°3 › Verrouillage DJ TR3B.pdf","but":["INTERDIRE la fermeture du sectionneur de terre de la cellule « DJ-TR3B » tant que le circuit de commande du groupe n’est pas mis hors service.","INTERDIRE l’accès au transformateur de puissance tant que le sectionneur de terre de la cellule disjoncteur n’est pas verrouillé dans la position FERMÉ.","INTERDIRE la manœuvre en charge du sectionneur de ligne.","INTERDIRE l’accès au disjoncteur et aux transformateurs de courant, sectionneur de ligne fermé.","PERMETTRE la manœuvre à vide du disjoncteur, sectionneur de ligne ouvert."],"steps":["Ouvrir et verrouiller ouvert le disjoncteur BT QTR3B (la clé A3B est libre).","Porter la clé A3B sur la serrure de condamnation du sectionneur de terre de la cellule « DJ-TR3B ».","Ouvrir et verrouiller « ouvert » le disjoncteur de la cellule « DJ-TR3B » (récupérer la clé D3B libre).","À l’aide de la clé D3B déverrouiller, ouvrir et verrouiller « ouvert » le sectionneur de ligne (la 1re clé D3B est prisonnière et la 2e clé D3B es <script>'use strict';
/* OCC ÉNERGIE — Cartographie du réseau électrique. Designed by Labidi El Fahli.

const D = window.OCC_DATA;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
/* Photos utilisées uniquement hors application comme références de reconstruction. */

/* ======================================================================= modèle */
const NODE = {}, BOARD = {}, ADJ = {}, DOWN = {}, UP = {};
D.nodes.forEach(n => NODE[n.id] = n);
D.boards.forEach(b => BOARD[b.id] = b);
// Gabarits vectoriels sans affirmation de géométrie, de position ou de connexion.
for (const b of D.boards) {
  if (b.facade && D.facades[b.facade]) continue;
  const fid = 'DOC_' + b.id;
  D.facades[fid] = {
    style: 'armoire_grise', title: b.name + ' — GABARIT NON COTÉ', brand: '',
    src: 'Inventaire OCC — dimensions et appareils non relevés',
    conf: 'PROVISOIRE : gabarit non coté sans appareils positionnés',
    height: 80, cols: [{ n: 'Géométrie inconnue', w: 820, units: [], doors: [[9, 71]] }],
    note: 'La liste des départs est consultable séparément ; aucune correspondance physique n’est présumée.'
  };
  b.facade = fid;
  b.vector_placeholder = true;
}
D.edges.forEach(e => {
  (ADJ[e.a] = ADJ[e.a] || []).push(e.b); (ADJ[e.b] = ADJ[e.b] || []).push(e.a);
  (DOWN[e.a] = DOWN[e.a] || []).push(e); (UP[e.b] = UP[e.b] || []).push(e);
});
const SW = new Set(['cb', 'sw', 'cpl', 'dep']);
const DEPS_BY_BOARD = {};
D.nodes.filter(n => n.t === 'dep').forEach(n => (DEPS_BY_BOARD[n.board] = DEPS_BY_BOARD[n.board] || []).push(n));
const TYPE = { src: 'Source', cb: 'Disjoncteur', sw: 'Interrupteur', cpl: 'Couplage', bus: 'Jeu de barres', tr: 'Transformateur', dep: 'Départ', load: 'Récepteur', board: 'Tableau', issue: 'Incohérence', proc: 'Procédure' };
const CONF = { confirme: ['g', 'Confirmé'], probable: ['b', 'Probable'], a_verifier: ['a', 'À vérifier'], inconnu: ['', 'Non documenté'] };
const confPill = c => { const [k, t] = CONF[c] || CONF.inconnu; return `<span class="pill ${k}">${t}</span>`; };
const ND = '<span class="muted">Non documenté</span>';

/* ======================================================================= simulation */
/* La simulation est une HYPOTHÈSE de travail, jamais une observation : elle est mémorisée avec son heure et signalée sur toutes les vues
   tant qu'elle diffère de la configuration normale documentée. Les fiches de dépannage ne dépendent pas d'elle. */
const SIM_KEY = 'occE.sim.v1', SIMT_KEY = 'occE.sim.t';
let SIM = {}, SIMT = 0, SANDBOX = false, LAST_CONFLICT = [];
try { SIM = JSON.parse(localStorage.getItem(SIM_KEY) || '{}'); SIMT = +localStorage.getItem(SIMT_KEY) || 0; } catch (e) { SIM = {}; }
function defaultClosed(n) {
  if (n.t === 'src') return n.id !== 'GE1';
  if (n.open0) return false;
  if (n.id === 'PL_A04' || n.id === 'TS9_QS' || n.id === 'KV6_C') return false;
  if (n.t === 'cpl' && n.board && BOARD[n.board] && BOARD[n.board].kind !== 'HTA') return false;
  return true;
}
const rawClosed = id => (id in SIM ? SIM[id] : defaultClosed(NODE[id]));
/* Permutation automatique de sources au poste de livraison (indication exploitant + unifilaire : « Décl. Manque 24VCC / Fermeture 24VCC ») :
   sur manque de tension CNR, la bobine à manque de tension ouvre l'arrivée CNR (B01) et l'arrivée EDF secours (A04) se ferme. */
const atsActive = () => !rawClosed('SRC_CNR') && rawClosed('SRC_EDF');
const isClosed = id => (id === 'PL_A04' && atsActive() ? true : id === 'PL_B01' && atsActive() ? false : rawClosed(id));
function saveSim() {
  if (SANDBOX) return;
  SIMT = Object.keys(SIM).length ? Date.now() : 0;
  try { localStorage.setItem(SIM_KEY, JSON.stringify(SIM)); localStorage.setItem(SIMT_KEY, String(SIMT)); } catch (e) {}
}
/* Règles appliquées en simulation (une fermeture est REFUSÉE si elle crée l'une de ces situations) :
   1. deux sources sur le même réseau : CNR et EDF ne peuvent jamais alimenter en même temps (indication exploitant), ni réseau + groupe électrogène ;
   2. deux transformateurs en parallèle sur un même jeu de barres (garde-fou conservatoire du simulateur ; aucune interdiction générale n'a été confirmée par l'exploitant le 15/10/2026 ; les permissifs physiques restent à documenter). */
const SRC_NAME = { SRC_CNR: 'CNR', SRC_EDF: 'EDF', GE1: 'groupe électrogène n°1' };
function conflicts() {
  const out = [];
  const reach = (start, stopTr) => { const seen = new Set([start]), q = [start];
    while (q.length) { const u = q.shift(); for (const v of nextOf(u)) { if (seen.has(v)) continue; const nv = NODE[v];
      if ((SW.has(nv.t) || nv.t === 'src') && !isClosed(v)) continue; if (stopTr && nv.t === 'tr') continue; seen.add(v); q.push(v); } }
    return seen; };
  // 2 bis. chaque TGBT est scindé en deux demi-jeux de barres, chacun alimenté par son transformateur ; le couplage ne se ferme
  //    qu'après ouverture de l'arrivée correspondante DANS CE SIMULATEUR (hypothèse conservatoire non confirmée comme règle site) : jamais arrivée A + couplage + arrivée B fermés,
  //    que les transformateurs soient sous tension ou non (sinon le transformateur hors service serait réalimenté par le côté BT)
  D.boards.forEach(b => { const qa = NODE[b.id + '_QA'], qb = NODE[b.id + '_QB'], qc = NODE[b.id + '_QC'];
    if (qa && qb && qc && isClosed(qa.id) && isClosed(qb.id) && isClosed(qc.id)) out.push({ kind: 'cpl', txt: `${b.name} : simulation bloquée par prudence : configuration avec deux arrivées et couplage fermés non qualifiée. Ceci ne décrit pas un verrouillage physique ni une interdiction générale sur site.` }); });
  // 3. interverrouillages par clé documentés appareil par appareil (ex. by-pass total onduleur / arrivée générale onduleur)
  D.nodes.forEach(n => { if (n.excl && isClosed(n.id) && isClosed(n.excl)) out.push({ kind: 'key', txt: `Interverrouillage par clé : « ${short(n)} » et « ${short(NODE[n.excl])} » ne peuvent pas être fermés en même temps.` }); });
  const srcs = D.nodes.filter(n => n.t === 'src' && isClosed(n.id));
  const bySrc = srcs.map(s => [s.id, reach(s.id, false)]);
  for (let i = 0; i < bySrc.length; i++) for (let j = i + 1; j < bySrc.length; j++) {
    const shared = [...bySrc[i][1]].find(x => bySrc[j][1].has(x) && NODE[x].t === 'bus');
    if (shared) out.push({ kind: 'src', txt: `Interverrouillage : ${SRC_NAME[bySrc[i][0]] || bySrc[i][0]} et ${SRC_NAME[bySrc[j][0]] || bySrc[j][0]} ne peuvent pas alimenter le réseau en même temps (jeu de barres commun : ${short(NODE[shared])}).` });
  }
  const trs = D.nodes.filter(n => n.t === 'tr' && LIVE_TMP.has(n.id));
  const byTr = trs.map(t => [t.id, reach(t.id, true)]);
  const seenPair = new Set();
  for (let i = 0; i < byTr.length; i++) for (let j = i + 1; j < byTr.length; j++) {
    const shared = [...byTr[i][1]].find(x => x !== byTr[i][0] && byTr[j][1].has(x) && NODE[x].t === 'bus');
    if (shared && !seenPair.has(shared)) { seenPair.add(shared); out.push({ kind: 'tr', txt: `Simulation conservatoire : ${short(NODE[byTr[i][0]])} et ${short(NODE[byTr[j][0]])} seraient en parallèle sur ${short(NODE[shared])}. Conditions de parallélisme non validées : simulation bloquée, sans constituer une consigne de manœuvre.` }); }
  }
  return out;
}
let LIVE_TMP = new Set();
function setSw(id, v) {
  const had = id in SIM, old = SIM[id];
  if (v === defaultClosed(NODE[id])) delete SIM[id]; else SIM[id] = v;
  LIVE_TMP = energize();
  if (v) { const c = conflicts(); LAST_CONFLICT = c; if (c.length) { if (had) SIM[id] = old; else delete SIM[id]; LIVE_TMP = energize(); LIVE = LIVE_TMP; if (!SANDBOX) { toast('⛔ Fermeture refusée'); refusal(id, c); } return false; } }
  saveSim(); LIVE = LIVE_TMP; return true;
}
function refusal(id, c) {
  openSheet(`<span class="pill r">Simulation</span><h2>Fermeture refusée : ${esc(short(NODE[id]))}</h2>`,
    `<div class="banner danger">⛔<div>${c.map(x => esc(x.txt)).join('<br>')}</div></div>
     <p class="small">Règles appliquées par le simulateur : jamais deux sources en même temps (CNR / EDF / groupe). Hypothèse conservatoire du simulateur (non assimilable à une règle d’exploitation du site) : la fermeture simultanée des deux arrivées et du couplage est bloquée tant que les conditions de parallélisme ne sont pas documentées. Le couplage de secours est pratiqué sur site ; vérifier ses permissifs et protections avant toute manœuvre.</p>`);
}
function resetSim() { SIM = {}; saveSim(); LIVE = LIVE_TMP = energize(); }
/* bandeau commun : une simulation modifiée est toujours signalée, avec son heure */
function simNotice() {
  const n = Object.keys(SIM).length; if (!n) return '';
  const t = SIMT ? new Date(SIMT).toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '—';
  return `<div class="banner sim simnote noprint">🧪<div class="grow"><b>Simulation en cours</b> — ${n} appareil(s) modifié(s), dernière modification le ${esc(t)}. Les couleurs vert / rouge montrent cette hypothèse, <b>pas l’état réel</b> de l’installation.</div><button class="btn ghost mini" id="simreset">Revenir à la configuration normale</button></div>`;
}
// propagation dans le sens amont → aval ; seuls les couplages sont traversés dans les deux sens
function nextOf(u) {
  const out = (DOWN[u] || []).map(e => e.b);
  (UP[u] || []).forEach(e => { if (NODE[e.a].t === 'cpl' || NODE[u].t === 'cpl') out.push(e.a); });
  return out;
}
function energize() {
  const live = new Set(), q = [];
  D.nodes.forEach(n => { if (n.t === 'src' && isClosed(n.id)) { live.add(n.id); q.push(n.id); } });
  while (q.length) {
    const u = q.shift();
    for (const v of nextOf(u)) {
      if (live.has(v)) continue;
      const nv = NODE[v];
      if ((SW.has(nv.t) || nv.t === 'src') && !isClosed(v)) continue;
      live.add(v); q.push(v);
    }
  }
  return live;
}
let LIVE = energize(); LIVE_TMP = LIVE;
// état mémorisé incohérent avec les interverrouillages (ancienne version) -> remise à l'hypothèse initiale
if (conflicts().length) { SIM = {}; saveSim(); LIVE = LIVE_TMP = energize(); }
const isLive = id => LIVE.has(id);
function interlock(boardId) {
  const qa = NODE[boardId + '_QA'], qb = NODE[boardId + '_QB'], qc = NODE[boardId + '_QC'];
  if (!qa || !qb || !qc) return null;
  const b = BOARD[boardId], n = [qa, qb, qc].filter(x => isClosed(x.id)).length;

/* ======================================================================= fiches de dépannage — PROJETS à valider
   Deux sortes de fiches :

     (unifilaire, classeur, plans Schneider, photos) et de la règle d'exploitation donnée par l'exploitant (jamais CNR + EDF ;
     jamais arrivée A · couplage · arrivée B fermés ensemble). Elles restent des PROJETS tant qu'elles ne sont pas inscrites dans
     validations.json, pour CET équipement et CETTE version de la fiche (empreinte du texte) ;
   - fiches de contrôle (tableau entièrement coupé, cellule HTA, défaut d'isolement, température transformateur, commande impossible) :
     aucune ouverture ni fermeture n'y est rédigée, seulement des observations à faire.
   La cause d'un symptôme est présentée comme une hypothèse tant que les observations ne la prouvent pas. Texte volontairement court. */
const VALID = D.validations || {};

const dev = x => `<b>${esc(dn(x))}</b>${tagOf(x) ? ` <span class="pill">${esc(tagOf(x))}</span>` : ''}`;
const isCond = x => /condensat|varset|varlogic/i.test(x.label) || /^COND/.test(x.feeds || '');
const depsOn = bus => (DOWN[bus] || []).map(e => NODE[e.b]).filter(x => x.t === 'dep');
const cellOf = tr => tr && tr.t === 'tr' ? NODE[((UP[tr.id] || [])[0] || {}).a] : null;
const isHTA = n => !!(n && n.board && BOARD[n.board] && BOARD[n.board].kind === 'HTA');
function srcSet(bid) {
  const qa = NODE[bid + '_QA'], qb = NODE[bid + '_QB'], qc = NODE[bid + '_QC'], b = BOARD[bid];
  if (!b || !qa || !qb || !qc || !(UP[qa.id] || []).length || !(UP[qb.id] || []).length) return null;
  const busQ = q => (DOWN[q.id] || []).map(e => e.b).find(x => NODE[x].t === 'bus');
  const ba = busQ(qa), bb = busQ(qb); if (!ba || !bb || ba === bb) return null;
  // le couplage doit relier directement les deux demi-jeux de barres (sinon : répartition des départs non documentée, ex. TS 12)
  const cu = (UP[qc.id] || []).map(e => e.a), cd = (DOWN[qc.id] || []).map(e => e.b);

/* mini-schéma d'un TGBT scindé en deux : TR A → arrivée A → ½ A ─ couplage ─ ½ B ← arrivée B ← TR B

/* --- départ déclenché (aussi : tableau secondaire coupé -> son départ d'alimentation) */

/* ======================================================================= arborescence du réseau

const tDot = id => { const v = BOARD[id] ? refLive(id) : NODE[id] ? (SW.has(NODE[id].t) && !isClosed(id) ? false : isLive(id)) : null; return `<span class="dot ${v === null ? 'unk' : v ? 'on' : 'off'}"></span>`; };

  if (!kids.length && !(DEPS_BY_BOARD[bid] || []).length) return `<div class="tnode tleaf" ${data}>${head}</div>`;
  const render = k => k.board ? arbreBoard(k.board, depth + 1, p2, tVia(k))
    : k.tr.map(t => `<div class="tnode tleaf" data-n="${esc(norm(t.tr.label))}">${tDot(t.tr.id)}<span class="ticon">◎</span><a class="tname" href="#" data-open="${t.tr.id}">${esc(dn(t.tr))}</a><span class="tmeta">${esc(t.tr.kva || '')} — ${esc(tnm('cellule', t.cell))}</span></div>`).join('');
  let inner;
  const s = srcSet(bid);
  if (s) {  // TGBT scindé : chaque moitié sous son transformateur
    const half = k => { const v = k.via[0]; const bu = v ? busOf(v.from.id) : null; return bu === s.ba ? 'A' : bu === s.bb ? 'B' : '?'; };
    const grp = { A: [], B: [], '?': [] }; kids.forEach(k => grp[half(k)].push(k));
    const hl = (h, lab, tr) => `<details class="tnode thalf" ${depth < 4 ? 'open' : ''} data-n="${esc(norm(lab))}"><summary>${tDot(h === 'A' ? s.ba : s.bb)}<span class="ticon">½</span><b>${esc(lab)}</b><span class="tmeta">sur ${esc(dn(tr))}${tr.kva ? ' ' + esc(tr.kva) : ''} · ${(DEPS_BY_BOARD[bid] || []).filter(d => busOf(d.id) === (h === 'A' ? s.ba : s.bb)).length} départs</span></summary><div class="tkids">${grp[h].map(render).join('') + arbreDepLeaves(bid, h === 'A' ? s.ba : s.bb) || '<div class="tnode tleaf tmeta">Aucun tableau ni départ documenté</div>'}</div></details>`;
    inner = hl('A', s.la, s.sa) + `<div class="tcpl">⇄ ${esc(tnm('couplage', s.qc))} —${isClosed(s.qc.id) ? 'fermé' : 'ouvert'} (simulation)</div>` + hl('B', s.lb, s.sb) + grp['?'].map(render).join('') + arbreDepLeaves(bid, { sa: s.ba, sb: s.bb }, true);
  } else inner = kids.map(render).join('') + arbreDepLeaves(bid, null);
  return `<details class="tnode" ${depth < 3 ? 'open' : ''} ${data}><summary>${head}</summary><div class="tkids">${inner}</div></details>`;
}
// Inventaire exhaustif : les équipements non reliés à la racine restent affichés,
// sans transformer une hypothèse documentaire en liaison d'exploitation.
function arbreSansOrigine() {
  const seen = new Set(['PL20']);
  const visit = (bid, path) => {
    if (path.length > 24) return;
    for (const k of arbreKids(bid, path)) {
      if (!k.board || path.includes(k.board)) continue;
      seen.add(k.board);
      visit(k.board, path.concat(k.board));
    }
  };
  visit('PL20', ['PL20']);
  const missing = D.boards.filter(b => !seen.has(b.id))
    .sort((a, b) => a.name.localeCompare(b.name, 'fr', { numeric: true }));
  if (!missing.length) return '';
  return `<details class="tnode tss" open data-n="origine non documentee armoires non rattachees">
    <summary><span class="ticon">⚠️</span><b>Origine non documentée / hors parcours CNR–EDF (${missing.length})</b>
      <span class="tmeta">inventoriés, mais aucun chemin complet démontré depuis la racine</span></summary>
    <div class="tkids"><p class="small muted">Ces éléments restent consultables. Cette rubrique ne signifie
      pas qu'ils sont hors tension et ne peut pas servir de consigne de manœuvre.</p>
      ${missing.map(b => `<div class="tnode tleaf" data-n="${esc(norm(b.name + ' ' + (b.alias || '')))}">
        <span class="dot unk"></span><span class="ticon">${tIcon(b)}</span>
        <a class="tname" href="#" data-go="#/b/${b.id}">${esc(b.name)}</a>
        <span class="tmeta">${esc(tLoc(b))} · ${(DEPS_BY_BOARD[b.id] || []).length} départ(s) · amont à établir</span>
        ${arbreDepLeaves(b.id, null)}
      </div>`).join('')}
    </div></details>`;
}
function arbreHTML() {
  // racine : sources → poste de livraison ; puis les tableaux 20 kV regroupés par sous-station
  const pl = BOARD.PL20, plKids = arbreKids('PL20', ['PL20']);
  const bySS = {};
  plKids.forEach(k => { const b = BOARD[k.board]; const loc = locChain(b.loc).find(l => l.kind === 'poste') || { id: '?', name: 'Localisation non documentée' }; (bySS[loc.id] = bySS[loc.id] || { loc, kids: [] }).kids.push(k); });
  const ss = Object.values(bySS).map(g => `<details class="tnode tss" open data-n="${esc(norm(g.loc.name))}"><summary><span class="ticon">🏭</span><b>${esc(g.loc.name)}</b></summary><div class="tkids">${g.kids.map(k => arbreBoard(k.board, 2, ['PL20'], tVia(k))).join('')}</div></details>`).join('');
  const ge = D.nodes.filter(n => n.t === 'src' && !['SRC_CNR', 'SRC_EDF'].includes(n.id));
  return `<details class="tnode troot" open data-n="cnr edf sources"><summary>${tDot('SRC_CNR')}<span class="ticon">⚡</span><b>CNR</b><span class="tmeta">réseau normal</span>
      <span class="tsep">/</span>${tDot('SRC_EDF')}<b>EDF</b><span class="tmeta">secours — bascule automatique sur manque CNR, jamais les deux ensemble</span></summary>
    <div class="tkids"><details class="tnode" open data-n="${esc(norm(pl.name))}"><summary>${tHead('PL20', 'arrivées CNR (01) et EDF (04)', '⚡')}</summary><div class="tkids">${ss}</div></details></div></details>
    ${ge.map(g => { const to = (DOWN[g.id] || []).map(e => NODE[e.b]).find(x => x && x.board); return `<div class="tnode tleaf" data-n="${esc(norm(g.label))}">${tDot(g.id)}<span class="ticon">⚙</span><b>${esc(dn(g))}</b><span class="tmeta">${to ? '→ ' + esc(BOARD[to.board].name) + ' (' + esc(dn(to)) + ')' : ''} — logique de permutation non documentée</span></div>`; }).join('')}
    ${arbreSansOrigine()}`;
}
function bindArbre(host) {
  const q = $('#tq'); if (!q) return;
  q.oninput = () => {
    const v = norm(q.value), nodes = $$('.tnode', host);
    nodes.forEach(n => { n.style.display = ''; });
    if (!v) return;
    // un nœud reste visible s'il correspond ou si un descendant correspond ; les ancêtres d'une correspondance sont dépliés
    const match = n => (n.dataset.n || '').includes(v);
    [...nodes].reverse().forEach(n => { const sub = $$('.tnode', n).some(c => c.style.display !== 'none'); n.style.display = match(n) || sub ? '' : 'none'; if (sub && n.tagName === 'DETAILS') n.open = true; });
    nodes.forEach(n => { if (match(n)) $$('.tnode', n).forEach(c => { c.style.display = ''; }); });
  };
  $('#topen').onclick = () => $$('details.tnode', host).forEach(d => d.open = true);
  $('#tclose').onclick = () => $$('details.tnode', host).forEach((d, i) => d.open = d.classList.contains('troot') || d.classList.contains('tss'));
}

/* Parcours documentaire continu : depart -> reseau -> zone -> plan -> facade.
   Les traits traces sont ceux reellement dessines par le schema.
   Aucune position, liaison ou configuration electrique n'est inferee comme certifiee. */

function parcoursContext(id) {
  const node = NODE[id] || null, board = BOARD[id] || boardOf(node);
  const locId = (board && board.loc) || (node && node.loc);
  const locs = locChain(locId);
  const place = locs.slice().reverse().find(l => l.bat !== undefined && l.bat !== null);
  const zone = place ? D.site.zones.find(z => String(z.n) === String(place.bat)) : null;
  const facade = node ? facadeFor(id) : null;
  const facadeBoard = facade ? boardForFacade(facade) : null;
  const plan = board ? planFor(board.id) : null;
  return { node, board, locs, place, zone, facade, facadeBoard, plan };
}

function parcoursPath(id) {
  if (!NODE[id]) return null;
  const path = bestPath(id);
  if (!path) return null;
  const chain = path.slice().reverse();
  const uncertain = {};
  chain.forEach((key, i) => {
    const n = NODE[key];
    const a = i ? chain[i - 1] : null;
    const edge = a && D.edges.find(e =>
      (e.a === a && e.b === key) || (e.b === a && e.a === key));
    uncertain[key] = !n || n.conf !== 'confirme' ||
      (i > 0 && (!edge || edge.conf !== 'confirme'));
  });
  return { chain, uncertain, alternatives: upPaths(id, 16).length };
}

function parcoursSummary(id) {
  const n = NODE[id], ctx = parcoursContext(id);
  const path = parcoursPath(id);
  const chain = path ? path.chain.map(key =>
    '<button type="button" class="trace-step ' +
    (path.uncertain[key] ? 'trace-doubt' : '') +
    '" data-open="' + esc(key) + '" title="' + esc(NODE[key].label) + '">' +
    esc(short(NODE[key])) + '</button>').join('<span class="trace-arrow">→</span>') :
    '<span class="muted">Pas de chemin complet jusqu’à une source dans le modèle.</span>';
  const doubtful = path && path.chain.some(key => path.uncertain[key]);
  const siteButton = ctx.zone ?
    '<button class="btn" type="button" data-go="#/site/' + esc(id) +
    '">📍 Localiser sur l’usine →</button>' :
    '<span class="pill a">Bâtiment non localisable avec les données actuelles</span>';
  const facadeButton = ctx.facade && ctx.facadeBoard ?
    '<button class="btn ghost" type="button" data-go="#/b/' + esc(ctx.facadeBoard) +
    '/f/' + esc(id) + '">▦ Voir la case sur la façade</button>' :
    '<span class="small muted">Case de façade non documentée.</span>';
  return '<section id="net-path" class="trace-summary" data-path-target="' + esc(id) + '">' +
    '<b>Chaîne d’alimentation documentaire</b> ' +
    (path && path.alternatives > 1 ? '<span class="pill a">Plusieurs parcours théoriques</span>' : '') +
    (doubtful ? '<span class="pill a">Certaines liaisons à confirmer</span>' : '') +
    '<div class="trace-steps">' + chain + '</div>' +
    '<div class="row" style="margin-top:10px">' + siteButton + facadeButton + '</div>' +
    '<p class="small muted" style="margin:8px 0 0">Trajet déduit des documents et du régime normal décrit, jamais de la position réelle des appareils. Les liaisons incertaines sont indiquées en pointillé orange.</p></section>';
}

function parcoursHighlight(id) {
  const svg = $('#hta svg');
  if (!svg) return;
  svg.querySelectorAll('.trace-node,.trace-wire,.trace-doubt').forEach(el => {
    el.classList.remove('trace-node', 'trace-wire', 'trace-doubt');
  });
  const path = parcoursPath(id);
  if (!path) return;
  path.chain.forEach(key => {
    svg.querySelectorAll('[data-id]').forEach(el => {
      if (el.dataset.id !== key) return;
      el.classList.add('trace-node');
      if (path.uncertain[key]) el.classList.add('trace-doubt');
    });
    svg.querySelectorAll('[data-wire-id]').forEach(el => {
      if (el.dataset.wireId !== key) return;
      el.classList.add('trace-wire');
      if (path.uncertain[key]) el.classList.add('trace-doubt');
    });
  });
}

/* Vue aérienne ciblée. Seules les zones dotées d'un repère bat
   explicite dans le modèle peuvent être mises en évidence. */
function vSite(id) {
  const ctx = parcoursContext(id);
  if (!ctx.node && !ctx.board) { vHome(); return; }
  const name = ctx.node ? ctx.node.label : ctx.board.name;
  const where = ctx.locs.length ? ctx.locs.map(l => l.name).join(' › ') : 'Non documentée';
  const siteLabel = ctx.zone ? (ctx.zone.label || ctx.zone.name) : null;
  const conf = ctx.board ? (ctx.board.loc_conf || 'inconnu') : (ctx.node.conf || 'inconnu');
  const planButton = ctx.plan && ctx.board ?
    '<button class="btn" id="site-continue-plan" data-go="#/plans/' +
    esc(ctx.plan) + '/' + esc(ctx.board.id) + '/' + esc(id) +
    '">Voir l’implantation du tableau →</button>' :
    '<span class="pill a">Position sur plan de local non renseignée</span>';
  const faceButton = ctx.facade && ctx.facadeBoard ?
    '<button class="btn ghost" id="site-direct-facade" data-go="#/b/' +
    esc(ctx.facadeBoard) + '/f/' + esc(id) + '">Voir le départ sur la façade →</button>' :
    '<span class="small muted">Aucun départ exact identifié sur une façade.</span>';
  VIEW().innerHTML = '<h1>Implantation géographique — ' + esc(name) + '</h1>' +
    '<p class="sub">Localisation documentaire du départ sélectionné, sans changer de repère.</p>' +
    '<div class="card glass" style="margin:10px 0;padding:14px">' +
    '<b>' + esc(ctx.board ? ctx.board.name : name) + '</b> ' + confPill(conf) +
    '<div class="small" style="margin:8px 0">Localisation : ' + esc(where) + '</div>' +
    (siteLabel ? '<div class="small"><b>Bâtiment ciblé : ' + esc(siteLabel) + '</b> (repérage documentaire)</div>' :
      '<div class="banner info">Aucun bâtiment géolocalisé pour ce départ : la carte reste générale et aucun halo n’est ajouté.</div>') +
    '<div class="row" style="margin-top:10px">' +
    '<button class="btn ghost" data-go="#/reseau/' + esc(id) + '">← Retour au réseau</button>' +
    planButton + faceButton + '</div></div>' +
    '<div id="site-map" class="sitemap" style="--ar:' + esc(D.site.ratio) + '"></div>' +
    '<p class="small muted">La vue aérienne montre le bâtiment documenté, non le chemin physique des câbles. Cliquer sur un autre bâtiment ouvre sa fiche. Les positions restent à confirmer sur site.</p>' +
    footer();
  mountViewer($('#site-map'), siteSVG(), {
    focus: ctx.zone ? 'Z' + ctx.zone.n : null,
    onClick: key => { if (key && key.startsWith('Z')) openZone(key.slice(1)); },
    native: D.site.tiles ? 1000 / D.site.w : null
  });
  if (D.site.tiles) orthoTiles($('#site-map svg'), D.site);
}

function parcoursPlanActions(focus, selected) {
  const n = NODE[selected], b = BOARD[focus];
  if (!n || !b) return '';
  const facade = facadeFor(n.id), targetBoard = facade ? boardForFacade(facade) : null;
  const btn = targetBoard ?
    '<button id="plan-to-facade" class="btn" data-go="#/b/' + esc(targetBoard) + '/f/' +
    esc(n.id) + '">Ouvrir la façade et surligner le départ →</button>' :

}

/* ---------- Réseau */
let SIMMODE = false, NETVIEW = 'full';
function netFocus(id) {
  // remonte jusqu'au premier élément dessiné sur le schéma complet (TGBT, transfo, cellule, ou tableau alimenté)
  let cur = id;
  for (let i = 0; i < 40 && cur; i++) {
    const n = NODE[cur];
    if (!n) return BOARD[cur] ? cur : null;
    if (['tr', 'src'].includes(n.t) || n.role === 'arrivee' || n.role === 'couplage' || (n.t === 'bus' && n.board && (BOARD[n.board].kind === 'TGBT' || BOARD[n.board].kind === 'HTA'))) return cur;
    if (n.board && BOARD[n.board] && BOARD[n.board].kind !== 'TGBT' && BOARD[n.board].kind !== 'HTA' && (UP[(BOARD[n.board].halves[0] || {}).id] || []).length) {
      const feeder = D.nodes.find(d => d.t === 'dep' && d.feeds === n.board); if (feeder) return n.board;
    }
    const u = (UP[cur] || [])[0]; cur = u ? u.a : null;
  }
  return null;
}

/* Recherche contextuelle sur l'unifilaire : reutilise l'index global sans modifier les donnees. */
const NET_FINDER = { query: '', selected: null };
function netFinderPanel() {
  return '<section class="card glass" style="padding:12px 14px;margin:12px 0" aria-label="Recherche sur le schema">' +
    '<label for="net-find" style="font-weight:700;display:block;margin-bottom:7px">Rechercher et localiser sur le schema</label>' +
    '<input id="net-find" class="f" type="search" autocomplete="off" style="width:100%;max-width:650px" ' +
    'placeholder="TR 1A, cellule, repere, TGBT, TS7..." aria-label="Rechercher un equipement sur le schema">' +
    '<div id="net-hits" class="list" style="margin-top:6px" role="listbox"></div>' +
    '<div id="net-doc" style="margin-top:8px" role="status" aria-live="polite"></div>' +
    '</section>';
}
function bindNetFinder(viewer) {
  const field = $('#net-find'), results = $('#net-hits'), detail = $('#net-doc');
  if (!field || !viewer) return;
  field.value = NET_FINDER.query;

  function infoFor(id) {
    const n = NODE[id], b = BOARD[id] || (n && boardOf(n));
    const locId = (b && b.loc) || (n && n.loc);
    const loc = locChain(locId).map(x => x.name).join(' / ') || 'Localisation non documentee';
    const conf = (b && b.loc_conf) || (n && n.conf) || 'inconnu';
    const keys = n && n.keys ? [String(n.keys)] :
      b ? D.nodes.filter(x => x.board === b.id && x.keys).slice(0, 8).map(x => short(x) + ' : ' + x.keys) : [];
    const title = b && !n ? b.name : n ? n.label : id;
    const related = D.issues.filter(i => issueActive(i) && (i.ents || []).some(e => e === id || (b && e === b.id))).slice(0, 4);
    const warning = related.length ? '<div class="banner danger" style="margin-top:8px">⚠️<div><b>Ecarts documentaires lies au repere :</b><br>' + related.map(i => '<a href="#" data-open="issue:' + esc(i.id) + '">' + esc(i.title) + '</a>').join('<br>') + '</div></div>' : '';
    const keyTxt = keys.length ? keys.map(x => '<div class="small">' + esc(x) + '</div>').join('') :
      '<span class="muted">Aucune cle associee a cette selection dans les donnees.</span>';
    detail.innerHTML = '<div class="card glass" style="padding:10px 12px">' +
      '<b>' + esc(title) + '</b> ' + confPill(n ? n.conf : conf) +
      '<div class="small" style="margin-top:7px"><b>Localisation documentaire :</b> ' + esc(loc) +
      (b && b.loc_conf && b.loc_conf !== 'confirme' ? ' (a confirmer)' : '') + '</div>' +
      '<div class="small" style="margin-top:5px"><b>Cles / reperes documentes :</b></div>' + keyTxt +
      warning + parcoursSummary(id) +
      '<div class="row" style="margin-top:8px"><button class="btn" type="button" data-open="' + esc(id) + '">Ouvrir la fiche</button>' +
      '<button class="btn ghost" type="button" data-go="#/plans">Ouvrir les plans de localisation</button></div>' +
      '<p class="small muted" style="margin:7px 0 0">Les cles et localisations proviennent des documents et ne constituent ni un relevé terrain ni une autorisation de manoeuvre.</p></div>';
  }
  function selectId(id) {
    NET_FINDER.selected = id;
    if (NETVIEW !== 'full' && NODE[id] && NODE[id].t === 'dep') { NETVIEW = 'full'; rerender(); return; }
    const target = NETVIEW === 'full' ? (BOARD[id] ? id : netFocus(id)) :
      (NODE[id] ? focusTarget(id) : null);
    if (!target || !viewer.focusOn(target)) {
      if (NETVIEW !== 'full') { NETVIEW = 'full'; rerender(); return; }
      toast('Selection documentee : cet equipement n est pas dessine directement sur le schema.');
    }
    infoFor(id);
    parcoursHighlight(id);
  }
  function renderHits() {
    NET_FINDER.query = field.value;
    const q = NET_FINDER.query.trim();
    if (!q) { results.innerHTML = ''; return; }
    const found = search(q, 70).filter(x => x.kind === 'node' || x.kind === 'board').slice(0, 12);
    results.innerHTML = found.length ? found.map(x =>
      '<button type="button" class="li" style="width:100%;text-align:left;cursor:pointer" data-net-id="' + esc(x.id) + '">' +
      '<span class="pill">' + esc(x.kind === 'board' ? 'Tableau' : (TYPE[x.t] || x.t)) + '</span>' +
      '<span class="grow"><b>' + esc(x.label) + '</b><span class="src" style="display:block">' + esc(recContext(x)) + '</span></span><span>⌖</span></button>').join('') :
      '<p class="small muted">Aucun element trouve dans le modele documente.</p>';
  }
  results.onclick = e => {
    const item = e.target.closest('[data-net-id]');
    if (item) selectId(item.dataset.netId);
  };
  field.addEventListener('input', renderHits);
  field.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const first = results.querySelector('[data-net-id]');
      if (first) { e.preventDefault(); selectId(first.dataset.netId); }
    }
  });
  renderHits();
  if (NET_FINDER.selected) infoFor(NET_FINDER.selected);
}
