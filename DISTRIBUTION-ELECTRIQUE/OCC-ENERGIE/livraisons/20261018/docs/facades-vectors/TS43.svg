<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 470" role="img" aria-label="Liste documentaire sans implantation physique"><style>.hl{fill:none;stroke:transparent}svg{color:#17201f;background:#eef1ef;--bg:#eef1ef;--glass-strong:#eef1ef}</style><rect width="1500" height="470" fill="#f1f5ef"/><text x="25" y="55" font-family="Arial,sans-serif" font-size="32" fill="#23362b">TS 43 — Filières 4A12 à 4A19</text><text x="25" y="112" font-family="Arial,sans-serif" font-size="27" fill="#23362b">LISTE DOCUMENTAIRE — AUCUNE IMPLANTATION PHYSIQUE</text><text x="25" y="160" font-family="Arial,sans-serif" font-size="22" fill="#23362b">Les blocs ci-dessous ne représentent ni des portes, ni des tiroirs, ni leur position.</text><text x="25" y="300" font-family="Arial,sans-serif" font-size="25" fill="#23362b">Aucun appareil détaillé dans les documents attribués.</text> <text x="25" y="440" font-family="Arial,sans-serif" font-size="20" fill="#23362b">Ouvrir les documents sources pour les informations disponibles.</text></svg>