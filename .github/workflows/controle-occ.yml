
name: OCC Energie - Controle qualite

on:
  push:
    branches:
      - ci/controle-occ-energie
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controle-code:
    name: Verification du code OCC
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verifier la syntaxe Python
        run: |
          python -m compileall -q \
            DISTRIBUTION-ELECTRIQUE/OCC-ENERGIE/tools

      - name: Verifier la syntaxe JavaScript
        run: |
          for file in DISTRIBUTION-ELECTRIQUE/OCC-ENERGIE/src/*.js; do
            node --check "$file"
          done

      - name: Verifier les fichiers essentiels
        run: |
          test -s DISTRIBUTION-ELECTRIQUE/OCC-ENERGIE/src/app.js
          test -s DISTRIBUTION-ELECTRIQUE/OCC-ENERGIE/src/plansvg.js
          test -s DISTRIBUTION-ELECTRIQUE/OCC-ENERGIE/build/data.json
          test -s DISTRIBUTION-ELECTRIQUE/OCC-ENERGIE/OCC_ENERGIE.html

      - name: Bilan
        run: echo "Controles de base OCC Energie termines"
