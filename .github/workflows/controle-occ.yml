
name: OCC Energie - Controle qualite

on:
  push:
    branches:
            - '**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controle-code:
    name: Verification du code OCC
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verifier la syntaxe Python
        run: |
          python -m compileall -q \
            DISTRIBUTION-ELECTRIQUE/OCC-ENERGIE/tools

      - name: Verifier la syntaxe JavaScript
        run: |
          for file in DISTRIBUTION-ELECTRIQUE/OCC-ENERGIE/src/*.js; do
            node --check "$file"
          done

      - name: Verifier les fichiers essentiels
        run: |
          test -s DISTRIBUTION-ELECTRIQUE/OCC-ENERGIE/src/app.js
          test -s DISTRIBUTION-ELECTRIQUE/OCC-ENERGIE/src/plansvg.js
          test -s DISTRIBUTION-ELECTRIQUE/OCC-ENERGIE/build/data.json
          test -s DISTRIBUTION-ELECTRIQUE/OCC-ENERGIE/OCC_ENERGIE.html

      - name: Reconstruire OCC Energie
        run: |
          python DISTRIBUTION-ELECTRIQUE/OCC-ENERGIE/tools/build_app.py

      - name: Verifier le HTML reconstruit
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path("DISTRIBUTION-ELECTRIQUE/OCC-ENERGIE")
          fichier = root / "OCC_ENERGIE.html"

          assert fichier.is_file(), "HTML absent"

          html = fichier.read_text(encoding="utf-8")

          assert html.startswith("<!doctype html>"), "HTML invalide"
          assert "window.OCC_DATA=" in html, "Donnees absentes"

          for marqueur in ("/*CSS*/", "/*DATA*/", "/*JS*/"):
              assert marqueur not in html, f"Assemblage incomplet : {marqueur}"

          print("Reconstruction OCC Energie : OK")
          print("Taille :", fichier.stat().st_size, "octets")
          PY

      - name: Garantir la synchronisation du HTML livre
        run: |
          git diff --exit-code -- DISTRIBUTION-ELECTRIQUE/OCC-ENERGIE/OCC_ENERGIE.html

      - name: Verifier la coherence electrique
        run: |
          python DISTRIBUTION-ELECTRIQUE/OCC-ENERGIE/tests/test_coherence_electrique.py

      - name: Bilan
        run: echo "Controles de base OCC Energie termines"
