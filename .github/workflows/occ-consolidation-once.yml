name: OCC Energie - Consolidation ponctuelle
on:
  push:
    branches:
      - codex/consolidation-occ-energie-2026-10-14
permissions:
  contents: write
jobs:
  consolidation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Appliquer et verifier les 2 fichiers volumineux
        run: python .occ-migration/apply.py
      - name: Enregistrer la version consolidee sur la branche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git diff --cached --quiet && exit 0
          git commit -m "OCC Energie - Integrer les fichiers generes verifies"
          git push origin HEAD:codex/consolidation-occ-energie-2026-10-14
