name: OCC Energie - Reconstruire HTML apres correction routeur
# Rebuild after facade selector fix

on:
  push:
    branches:
      - codex/fiabilite-parcours-inverse-2026-10-14
    paths: ['.github/workflows/occ-rebuild-parcours-temp.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python DISTRIBUTION-ELECTRIQUE/OCC-ENERGIE/tools/build_app.py
      - run: |
          python - <<'PY'
          from pathlib import Path
          f=Path('DISTRIBUTION-ELECTRIQUE/OCC-ENERGIE/OCC_ENERGIE.html')
          s=f.read_text(encoding='utf-8')
          assert all(x in s for x in ("facade-to-reseau","LAST_ROUTED_HASH","selectedDeparture"))
          print(f.stat().st_size, "octets, routeur et parcours inverse integres")
          PY
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DISTRIBUTION-ELECTRIQUE/OCC-ENERGIE/OCC_ENERGIE.html
          if git diff --cached --quiet; then
            echo "Deja a jour"
          else
            git commit -m 'build(occ): synchroniser HTML apres correction du routeur'
            git pull --rebase origin codex/fiabilite-parcours-inverse-2026-10-14
            git push origin HEAD:codex/fiabilite-parcours-inverse-2026-10-14
          fi
