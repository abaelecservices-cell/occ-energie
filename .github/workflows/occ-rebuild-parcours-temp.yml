name: OCC Energie - Reconstruction HTML parcours (temporaire)

on:
  push:
    branches:
      - codex/fiabilite-parcours-inverse-2026-10-14
    paths:
      - '.github/workflows/occ-rebuild-parcours-temp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruire:
    if: github.ref == 'refs/heads/codex/fiabilite-parcours-inverse-2026-10-14'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruire depuis sources et donnees
        run: python DISTRIBUTION-ELECTRIQUE/OCC-ENERGIE/tools/build_app.py
      - name: Controler les marqueurs assembles
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path("DISTRIBUTION-ELECTRIQUE/OCC-ENERGIE/OCC_ENERGIE.html").read_text(encoding="utf-8")
          assert html.startswith("<!doctype html>")
          for value in ("facade-to-reseau","selectedDeparture","parcoursHighlight"):
              assert value in html, "Absent du HTML : " + value
          for value in ("/*CSS*/","/*DATA*/","/*JS*/","/*PLANS*/"):
              assert value not in html, "Assemblage incomplet"
          print("HTML synchrone et parcours inverse present")
          PY
      - name: Commiter uniquement HTML sur branche de travail
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DISTRIBUTION-ELECTRIQUE/OCC-ENERGIE/OCC_ENERGIE.html
          if git diff --cached --quiet; then
            echo "Pas de difference"
          else
            git commit -m "build(occ-energie): synchroniser navigation inverse dans HTML autonome"
            git pull --rebase origin codex/fiabilite-parcours-inverse-2026-10-14
            git push origin HEAD:codex/fiabilite-parcours-inverse-2026-10-14
          fi
