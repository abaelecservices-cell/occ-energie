name: OCC Energie - Reconstruction HTML finale temporaire

on:
  push:
    branches: [codex/fiabilite-parcours-inverse-2026-10-14]
    paths: ['.github/workflows/occ-rebuild-parcours-temp.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python DISTRIBUTION-ELECTRIQUE/OCC-ENERGIE/tools/build_app.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DISTRIBUTION-ELECTRIQUE/OCC-ENERGIE/OCC_ENERGIE.html
          if git diff --cached --quiet; then
            echo "HTML deja a jour"
          else
            git commit -m 'build(occ): finaliser HTML de la navigation inverse'
            git pull --rebase origin codex/fiabilite-parcours-inverse-2026-10-14
            git push origin HEAD:codex/fiabilite-parcours-inverse-2026-10-14
          fi
