name: OCC Energie - Synchroniser parcours HTML

on:
  push:
    branches:
      - codex/parcours-depart-site-facade-2026-10-14
    paths:
      - '.github/workflows/occ-rebuild-parcours-temp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  html:
    if: github.ref == 'refs/heads/codex/parcours-depart-site-facade-2026-10-14'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruire le HTML autonome
        run: python DISTRIBUTION-ELECTRIQUE/OCC-ENERGIE/tools/build_app.py
      - name: Verifier la presence du parcours integre
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('DISTRIBUTION-ELECTRIQUE/OCC-ENERGIE/OCC_ENERGIE.html')
          t=p.read_text(encoding='utf-8')
          assert t.startswith('<!doctype html>')
          for marker in ('window.OCC_DATA=', 'function parcoursContext(', 'function vSite(',
                         'function parcoursHighlight(', 'data-wire-id', 'function parcoursPlanActions('):
              assert marker in t, f"Absent du HTML : {marker}"
          for marker in ('/*CSS*/','/*DATA*/','/*JS*/','/*PLANS*/'):
              assert marker not in t, f'Assemblage incomplet : {marker}'
          print('HTML pret',p.stat().st_size)
          PY
      - name: Publier sur la branche de travail uniquement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DISTRIBUTION-ELECTRIQUE/OCC-ENERGIE/OCC_ENERGIE.html
          if git diff --cached --quiet; then
            echo 'HTML identique'
          else
            git commit -m 'build(occ-energie): livrer le parcours interactif autonome'
            git pull --rebase origin codex/parcours-depart-site-facade-2026-10-14
            git push origin HEAD:codex/parcours-depart-site-facade-2026-10-14
          fi
