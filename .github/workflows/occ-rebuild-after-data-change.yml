name: OCC Energie - Regeneration modele et HTML
on:
  push:
    branches: ['main', 'integration/consolidation-securisee-20261015', 'codex/**']
    paths: ['DISTRIBUTION-ELECTRIQUE/OCC-ENERGIE/**', '.github/workflows/**']
  pull_request:
    branches: ['main', 'integration/consolidation-securisee-20261015']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: occ-energie-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruire tous les livrables et tester
        run: python DISTRIBUTION-ELECTRIQUE/OCC-ENERGIE/tools/rebuild.py
      - name: Verifier les fichiers livres sans ecrire sur la branche
        run: git diff --exit-code -- DISTRIBUTION-ELECTRIQUE/OCC-ENERGIE
      - uses: actions/upload-artifact@v4
        with:
          name: occ-energie-html-consolides
          path: DISTRIBUTION-ELECTRIQUE/OCC-ENERGIE/OCC_ENERGIE*.html
          if-no-files-found: error
          retention-days: 30
