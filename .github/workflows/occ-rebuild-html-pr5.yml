name: OCC Energie - Reconstruire le HTML (PR5)

on:
  push:
    branches:
      - codex/reprise-unifilaire-navigation-2026-10-14
    paths:
      - '.github/workflows/occ-rebuild-html-pr5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruire:
    if: github.ref == 'refs/heads/codex/reprise-unifilaire-navigation-2026-10-14'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Recuperer la branche de travail
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruire le HTML depuis les donnees les plus recentes
        run: python DISTRIBUTION-ELECTRIQUE/OCC-ENERGIE/tools/build_app.py
      - name: Verifier le fichier HTML assemble
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          file=Path('DISTRIBUTION-ELECTRIQUE/OCC-ENERGIE/OCC_ENERGIE.html')
          html=file.read_text(encoding='utf-8')
          assert html.startswith('<!doctype html>'), 'HTML mal forme'
          for marker in ['netFinderPanel', 'bindNetFinder', 'window.OCC_DATA=']:
              assert marker in html, f'Fonction ou donnees manquantes : {marker}'
          for marker in ['/*CSS*/','/*DATA*/','/*JS*/']:
              assert marker not in html, f'Assemblage incomplet : {marker}'
          print('HTML valide et navigation unifilaire integree :', file.stat().st_size,'octets')
          PY
      - name: Publier le HTML genere sur la branche de la PR5
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DISTRIBUTION-ELECTRIQUE/OCC-ENERGIE/OCC_ENERGIE.html
          if git diff --cached --quiet; then
            echo "HTML deja a jour."
          else
            git commit -m "build(occ-energie): synchroniser HTML avec sources et donnees actualisees"
            git push origin HEAD:codex/reprise-unifilaire-navigation-2026-10-14
          fi
