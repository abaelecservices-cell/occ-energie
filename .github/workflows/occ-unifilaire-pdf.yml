name: OCC Energie - Planches unifilaires A3/A2

on:
  push:
    branches:
      - codex/reprise-unifilaire-navigation-2026-10-14
    paths:
      - 'DISTRIBUTION-ELECTRIQUE/OCC-ENERGIE/tools/generer_planches.py'
      - 'DISTRIBUTION-ELECTRIQUE/Plan électrique/schema unifilaire 20 KV derniere version.pdf'
      - '.github/workflows/occ-unifilaire-pdf.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  planches:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer outils PDF vectoriels
        run: python -m pip install --disable-pip-version-check 'pymupdf==1.26.5' 'pypdf==5.9.0'
      - name: Generer les deux dossiers imprimables
        run: python DISTRIBUTION-ELECTRIQUE/OCC-ENERGIE/tools/generer_planches.py
      - name: Publier les PDF dans les artefacts GitHub
        uses: actions/upload-artifact@v4
        with:
          name: occ-energie-schema-20kv-A3-A2
          path: DISTRIBUTION-ELECTRIQUE/OCC-ENERGIE/artifacts/unifilaire/*.pdf
          if-no-files-found: error
          retention-days: 30
